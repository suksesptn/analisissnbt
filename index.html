<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis SNBT - Sukses PTN Al Bayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#059669', primaryDark: '#047857', background: '#F8FAFC' }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-slate-800 antialiased min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="https://suksesptn.github.io" class="text-slate-400 hover:text-primary">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </a>
                <div class="bg-primary text-white p-2 rounded-lg">
                    <i data-lucide="target" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">Analisis SNBT</h1>
                    <p class="text-xs text-slate-500">Database Kelulusan 2026</p>
                </div>
            </div>
            <button onclick="logout()" id="logoutBtn" class="hidden text-slate-400 hover:text-rose-500">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- HALAMAN LOGIN -->
        <div id="loginPage" class="max-w-md mx-auto mt-10">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div class="text-center mb-6">
                    <div class="bg-emerald-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="lock" class="w-8 h-8 text-primary"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Login Analisis SNBT</h2>
                    <p class="text-sm text-slate-500">Pilih jenis akun untuk melanjutkan</p>
                </div>

                <!-- Tab Login -->
                <div class="flex gap-2 mb-6">
                    <button onclick="switchTab('siswa')" id="tabSiswa" class="flex-1 py-2 px-4 rounded-lg bg-primary text-white font-medium">
                        Siswa/Orangtua
                    </button>
                    <button onclick="switchTab('guru')" id="tabGuru" class="flex-1 py-2 px-4 rounded-lg bg-slate-100 text-slate-600 font-medium">
                        Guru
                    </button>
                </div>

                <!-- Form Siswa -->
                <form id="formSiswa" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">NIS</label>
                        <input type="text" id="nis" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none" placeholder="Masukkan NIS">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Tanggal Lahir</label>
                        <input type="date" id="tglLahir" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-3 rounded-xl">
                        Masuk sebagai Siswa
                    </button>
                </form>

                <!-- Form Guru -->
                <form id="formGuru" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Username</label>
                        <input type="text" id="username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none" placeholder="Username">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Password</label>
                        <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-emerald-200 outline-none" placeholder="Password">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl">
                        Masuk sebagai Guru
                    </button>
                </form>

                <div id="loginError" class="hidden mt-4 p-3 rounded-lg bg-rose-50 text-rose-700 text-sm"></div>
            </div>
        </div>

        <!-- DASHBOARD (Hidden by default) -->
        <div id="dashboard" class="hidden space-y-6">
            
            <!-- Welcome Banner -->
            <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-6 text-white">
                <h2 class="text-2xl font-bold mb-2">📊 Analisis SNBT 2026</h2>
                <p class="opacity-90">Gunakan data kelulusan tahun lalu untuk menentukan target skor Anda</p>
            </div>

            <!-- Search & Filter -->
            <div class="bg-white rounded-2xl shadow-sm p-5">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Cari PTN</label>
                        <input type="text" id="searchPTN" placeholder="Contoh: ITB, UI, UGM" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Cari Jurusan</label>
                        <input type="text" id="searchProdi" placeholder="Contoh: Teknik Informatika" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Jenjang</label>
                        <select id="filterJenjang" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-primary outline-none">
                            <option value="">Semua</option>
                            <option value="S1">S1</option>
                            <option value="D4">D4</option>
                            <option value="D3">D3</option>
                        </select>
                    </div>
                </div>
                <button onclick="filterData()" class="mt-4 bg-primary text-white px-6 py-2 rounded-lg font-medium hover:bg-primaryDark">
                    <i data-lucide="search" class="w-4 h-4 inline mr-2"></i>Cari
                </button>
            </div>

            <!-- Statistics Cards -->
            <div id="statsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Will be populated by JS -->
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <div class="p-5 border-b border-slate-100">
                    <h3 class="text-lg font-bold">Data Kelulusan per Jurusan</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-semibold">PTN</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold">Jurusan</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold">Jenjang</th>
                                <th class="px-4 py-3 text-center text-sm font-semibold">Rata-rata Skor</th>
                                <th class="px-4 py-3 text-center text-sm font-semibold">Skor Min</th>
                                <th class="px-4 py-3 text-center text-sm font-semibold">Skor Max</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable" class="divide-y divide-slate-100">
                            <!-- Will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9xOPd0jC-_0nSKpOZpRRzxO4pJW9sYmeuT8KwkpPTG3IAXFMgTAPCAet39ubnaVu9/exec";
        let currentUser = null;
        let allData = [];

        lucide.createIcons();

        function switchTab(role) {
            const tabSiswa = document.getElementById('tabSiswa');
            const tabGuru = document.getElementById('tabGuru');
            const formSiswa = document.getElementById('formSiswa');
            const formGuru = document.getElementById('formGuru');

            if (role === 'siswa') {
                tabSiswa.className = 'flex-1 py-2 px-4 rounded-lg bg-primary text-white font-medium';
                tabGuru.className = 'flex-1 py-2 px-4 rounded-lg bg-slate-100 text-slate-600 font-medium';
                formSiswa.classList.remove('hidden');
                formGuru.classList.add('hidden');
            } else {
                tabGuru.className = 'flex-1 py-2 px-4 rounded-lg bg-blue-600 text-white font-medium';
                tabSiswa.className = 'flex-1 py-2 px-4 rounded-lg bg-slate-100 text-slate-600 font-medium';
                formGuru.classList.remove('hidden');
                formSiswa.classList.add('hidden');
            }
        }

        document.getElementById('formSiswa').addEventListener('submit', async function(e) {
            e.preventDefault();
            await login('siswa', document.getElementById('nis').value, document.getElementById('tglLahir').value);
        });

        document.getElementById('formGuru').addEventListener('submit', async function(e) {
            e.preventDefault();
            await login('guru', document.getElementById('username').value, document.getElementById('password').value);
        });

        async function login(role, param1, param2) {
            const url = role === 'siswa' 
                ? `${APPS_SCRIPT_URL}?action=loginSiswa&nis=${param1}&tglLahir=${param2}`
                : `${APPS_SCRIPT_URL}?action=loginGuru&username=${param1}&password=${param2}`;

            try {
                const res = await fetch(url);
                const result = await res.json();

                if (result.success) {
                    currentUser = result;
                    showDashboard();
                    loadData();
                } else {
                    showError(result.message);
                }
            } catch (err) {
                showError('Gagal terhubung ke server');
            }
        }

        function showDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
        }

        async function loadData() {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getStatistikJurusan`);
                const result = await res.json();

                if (result.success) {
                    allData = result.statistik;
                    renderData(allData);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderData(data) {
            const tbody = document.getElementById('dataTable');
            const statsContainer = document.getElementById('statsContainer');
            
            tbody.innerHTML = '';
            statsContainer.innerHTML = '';

            data.forEach(item => {
                // Calculate average total score
                const scores = Object.values(item.scores);
                const avgTotal = (scores.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) / scores.length).toFixed(2);
                const minTotal = Object.values(item.min).reduce((a, b) => parseFloat(a) + parseFloat(b), 0).toFixed(2);
                const maxTotal = Object.values(item.max).reduce((a, b) => parseFloat(a) + parseFloat(b), 0).toFixed(2);

                // Add to table
                const row = tbody.insertRow();
                row.className = 'hover:bg-slate-50';
                row.innerHTML = `
                    <td class="px-4 py-3 text-sm font-medium">${item.ptn}</td>
                    <td class="px-4 py-3 text-sm">${item.prodi}</td>
                    <td class="px-4 py-3 text-sm"><span class="px-2 py-1 rounded bg-slate-100 text-xs font-medium">${item.jenjang}</span></td>
                    <td class="px-4 py-3 text-center text-sm font-bold text-emerald-600">${avgTotal}</td>
                    <td class="px-4 py-3 text-center text-sm text-rose-600">${minTotal}</td>
                    <td class="px-4 py-3 text-center text-sm text-blue-600">${maxTotal}</td>
                `;

                // Add stats card (top 3)
                if (statsContainer.children.length < 6) {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-sm p-4 border border-slate-100';
                    card.innerHTML = `
                        <h4 class="font-semibold text-sm mb-2 truncate">${item.prodi}</h4>
                        <p class="text-xs text-slate-500 mb-3">${item.ptn} • ${item.jenjang}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-600">Rata-rata:</span>
                            <span class="text-lg font-bold text-emerald-600">${avgTotal}</span>
                        </div>
                        <div class="mt-2 text-xs text-slate-500">
                            Range: ${minTotal} - ${maxTotal}
                        </div>
                    `;
                    statsContainer.appendChild(card);
                }
            });

            lucide.createIcons();
        }

        function filterData() {
            const ptn = document.getElementById('searchPTN').value.toLowerCase();
            const prodi = document.getElementById('searchProdi').value.toLowerCase();
            const jenjang = document.getElementById('filterJenjang').value;

            const filtered = allData.filter(item => {
                const matchPTN = item.ptn.toLowerCase().includes(ptn);
                const matchProdi = item.prodi.toLowerCase().includes(prodi);
                const matchJenjang = jenjang ? item.jenjang === jenjang : true;
                return matchPTN && matchProdi && matchJenjang;
            });

            renderData(filtered);
        }

        function showError(msg) {
            const errDiv = document.getElementById('loginError');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('formSiswa').reset();
            document.getElementById('formGuru').reset();
        }
    </script>
</body>
</html>
